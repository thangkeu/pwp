name: PWP Gateway CI/CD

on:
  push:
    branches: [main, develop]
    paths:
      - 'docker/gateway/**'
      - '.github/workflows/ci-cd.yml'
  pull_request:
    branches: [main, develop]
    paths:
      - 'docker/gateway/**'
      - '.github/workflows/ci-cd.yml'

defaults:
  run:
    working-directory: docker/gateway

jobs:
  lint-and-test:
    name: Lint + Unit/Integration Test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: docker/gateway/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Lint (ESLint)
        run: npm run lint

      - name: Unit + Integration Test (coverage)
        run: npm run test:coverage

      - name: Upload coverage artifact
        uses: actions/upload-artifact@v4
        with:
          name: gateway-coverage
          path: docker/gateway/coverage

  build-image:
    name: Build & Push Docker Image
    needs: lint-and-test
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4

      - name: Log in to registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: docker/gateway
          push: true
          tags: |
            ghcr.io/${{ github.repository }}/pwp-gateway:${{ github.sha }}
            ghcr.io/${{ github.repository }}/pwp-gateway:latest

  deploy-staging:
    name: Deploy to Staging (tự động)
    needs: build-image
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    runs-on: ubuntu-latest
    environment: staging
    steps:
      - name: Deploy staging
        run: |
          echo "TODO Sprint sau: thay bằng lệnh deploy staging thật (ssh/compose pull/up -d)."
          echo "Image: ghcr.io/${{ github.repository }}/pwp-gateway:${{ github.sha }}"

  deploy-production:
    name: Deploy to Production (cần Manual Approval)
    needs: deploy-staging
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    runs-on: ubuntu-latest
    environment: production # Cấu hình "Required reviewers" trong GitHub repo Settings > Environments
    steps:
      - name: Deploy production
        run: |
          echo "TODO Sprint sau: thay bằng lệnh deploy production thật."
          echo "Image: ghcr.io/${{ github.repository }}/pwp-gateway:${{ github.sha }}"

      - name: Post-Deployment Verification (INSTRUCTIONS.md 8.7)
        run: |
          echo "TODO Sprint sau: curl GET /api/health thật trên domain production, assert status=ok."
